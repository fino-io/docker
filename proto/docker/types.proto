syntax = "proto3";

package docker;

option go_package = "github.com/fino-io/docker/go/docker;docker";

// Status describes the state of an item.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
}

// Item is the basic record in this schema.
message Item {
  // Stable identifier for the item.
  string id = 1;
  // Current state of the item.
  Status status = 2;
}
